<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BNI 파이오니아 챕터 초대장</title>
<meta property="og:title" content="BNI 파이오니아 챕터에 초대합니다">
<meta property="og:description" content="한번의 방문으로 새로운 비즈니스 기회를 만듭니다. 방문 신청하기">
<!-- 카톡 미리보기: 기존 이미지 초대장 파일(예: og.jpg)을 같은 폴더에 올리고 아래 주석을 풀어 주소를 넣으세요 -->
<!-- <meta property="og:image" content="https://내주소/og.jpg"> -->
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2330; --sub:#667085; --line:#d9dde4; --main:#c8102e; --soft:#fdecef; }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; line-height:1.6; }
  .wrap { max-width:480px; margin:0 auto; padding:0 16px 96px; }

  .hero { background:#fff; margin:0 -16px; padding:40px 24px 32px; text-align:center; border-bottom:4px solid var(--main); }
  .hero .tag { font-size:11px; letter-spacing:.14em; color:var(--sub); }
  .hero .logo { font-size:44px; font-weight:900; color:var(--main); letter-spacing:-.02em; margin:6px 0 2px; }
  .hero h1 { font-size:24px; line-height:1.3; margin:0 0 6px; }
  .hero h1 em { display:block; font-style:normal; color:var(--main); font-size:28px; }
  .hero p { margin:8px 0 0; color:var(--sub); font-size:14px; }

  section { background:var(--card); border-radius:14px; padding:22px 18px; margin-top:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  h2 { font-size:18px; margin:0 0 12px; }
  .big { text-align:center; }
  .big h2 { font-size:20px; margin-bottom:4px; }
  .big h2 em { font-style:normal; color:var(--main); }
  .big p { margin:0; color:var(--sub); font-size:14px; }
  .badge { background:var(--soft); border-radius:12px; padding:16px; text-align:center; margin-top:16px; font-weight:700; }
  .badge em { display:block; font-style:normal; color:var(--main); font-size:19px; }

  dl.info { margin:0; }
  dl.info > div { display:flex; gap:14px; padding:12px 0; border-bottom:1px solid var(--line); font-size:15px; }
  dl.info > div:last-child { border-bottom:0; }
  dl.info dt { flex:none; width:64px; color:var(--main); font-weight:700; }
  dl.info dd { margin:0; }
  .acct { margin-top:6px; font-size:13px; color:var(--sub); }
  .acct button { margin-left:6px; padding:3px 10px; font-size:12px; border:1px solid var(--line); background:#fff; border-radius:6px; }

  label { display:block; font-weight:600; font-size:14px; margin:16px 0 6px; }
  form label:first-of-type { margin-top:0; }
  .req::after { content:" *"; color:var(--main); }
  input[type=text], input[type=tel], input[type=date] { width:100%; font-size:16px; padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff; font-family:inherit; }
  input:focus { outline:2px solid var(--main); border-color:transparent; }
  .hint { font-size:12px; color:var(--sub); margin-top:4px; }
  .agree { display:flex; gap:10px; align-items:flex-start; margin-top:20px; font-size:13px; color:var(--sub); line-height:1.5; font-weight:400; }
  .agree input { margin-top:3px; width:18px; height:18px; flex:none; }
  button.submit { width:100%; margin-top:20px; padding:14px; font-size:16px; font-weight:700; color:#fff; background:var(--main); border:0; border-radius:10px; }
  button:disabled { opacity:.5; }
  .err { color:var(--main); font-size:13px; margin-top:10px; display:none; }
  .done { display:none; text-align:center; padding:28px 0; }
  .done h2 { margin-bottom:8px; }

  .cta { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:rgba(255,255,255,.95); border-top:1px solid var(--line); }
  .cta a { display:block; max-width:448px; margin:0 auto; text-align:center; text-decoration:none; padding:14px; font-size:16px; font-weight:700; color:#fff; background:var(--main); border-radius:10px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="tag">BUSINESS NETWORKING INVITATION</div>
    <div class="logo">BNI</div>
    <h1>비즈니스 네트워크 초대<em id="chapterName"></em></h1>
    <p id="slogan"></p>
  </div>

  <section class="big">
    <h2>한번의 방문으로<br><em>새로운 비즈니스 기회를 만듭니다.</em></h2>
    <p>당신의 비즈니스에 새로운 연결을 만드십시오.</p>
    <div class="badge">부산 대표 사업가들과 함께하는<em>프리미엄 비즈니스 네트워크</em></div>
  </section>

  <section>
    <h2>방문 안내</h2>
    <dl class="info">
      <div><dt>일정</dt><dd id="when"></dd></div>
      <div><dt>장소</dt><dd id="where"></dd></div>
      <div><dt>준비사항</dt><dd id="bring"></dd></div>
      <div><dt>참가비</dt><dd><span id="fee"></span>
        <div class="acct" id="acctRow"><span id="acct"></span><button type="button" id="copy">계좌 복사</button></div>
      </dd></div>
    </dl>
  </section>

  <section id="apply">
    <h2>방문 신청</h2>
    <form id="f" autocomplete="on">
      <label class="req" for="name">이름</label>
      <input type="text" id="name" name="name" required autocomplete="name">

      <label class="req" for="phone">연락처</label>
      <input type="tel" id="phone" name="phone" required inputmode="tel" placeholder="010-0000-0000" autocomplete="tel">

      <label class="req" for="company">회사명</label>
      <input type="text" id="company" name="company" required autocomplete="organization">

      <label class="req" for="industry">업종</label>
      <input type="text" id="industry" name="industry" required placeholder="예) 인테리어, 세무, 음식점">

      <label class="req" for="years">업력</label>
      <input type="text" id="years" name="years" required placeholder="예) 5년">

      <label class="req" for="inviter">초대해주신 분</label>
      <input type="text" id="inviter" name="inviter" required placeholder="성함 (심포지엄에서 오셨다면 '심포지엄')">

      <label class="req" for="visitdate">방문 희망일</label>
      <input type="date" id="visitdate" name="visitdate" required>
      <div class="hint" id="dateHint"></div>

      <label for="wanted">소개받고 싶은 업종</label>
      <input type="text" id="wanted" name="wanted" placeholder="예) 세무사, 마케팅 대행">

      <label class="agree">
        <input type="checkbox" id="agree" required>
        <span>방문 안내 및 후속 연락(문자·전화)을 위해 개인정보(이름, 연락처, 회사 정보) 수집·이용에 동의합니다.</span>
      </label>

      <button type="submit" class="submit" id="btn">방문 신청하기</button>
      <div class="err" id="err">전송에 실패했습니다. 잠시 후 다시 시도해주세요.</div>
    </form>

    <div class="done" id="done">
      <h2>신청이 완료되었습니다</h2>
      <p>감사합니다. 방문 전에 안내 연락을 드리겠습니다.</p>
    </div>
  </section>
</div>

<div style="text-align:center;color:#98a2b3;font-size:11px;margin:8px 0 90px">v1816 · zORNK</div>

<div class="cta" id="cta"><a href="#apply">방문 신청하기</a></div>

<script>
// ===== 설정: 여기만 고치면 됩니다 =====
// 심포지엄과 같은 Apps Script 주소를 쓰세요
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzORNKur72TZA9o1aB0KIasdctqDzERniL_s93YoNBoy85xwr7wKESrHoegmxR8Mk38/exec";

const CHAPTER = {
  name:   "파이오니아 챕터",
  slogan: "함께하는 비즈니스, 더 큰 가치를 만듭니다.",
  when:   "매주 수요일 오전 6시 30분",
  where:  "부산광역시 남구 전포대로 133, 아바니센트럴부산",
  bring:  "비즈니스북장 / 명함 30장",
  fee:    "5만원",
  account:"카카오뱅크 79423640105 정상현",   // 계좌를 노출하지 않으려면 "" 로 비우세요
  weekday: 3                                  // 모임 요일 (0=일 … 3=수 … 6=토)
};
// ====================================

const $ = (id) => document.getElementById(id);
$("chapterName").textContent = CHAPTER.name;
$("slogan").textContent = CHAPTER.slogan;
$("when").textContent  = CHAPTER.when;
$("where").textContent = CHAPTER.where;
$("bring").textContent = CHAPTER.bring;
$("fee").textContent   = CHAPTER.fee;
if (CHAPTER.account) {
  $("acct").textContent = CHAPTER.account;
  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(CHAPTER.account.replace(/[^0-9]/g, "").length ? CHAPTER.account.match(/\d+/)[0] : CHAPTER.account); $("copy").textContent = "복사됨"; } catch (e) {}
  };
} else { $("acctRow").style.display = "none"; }

// 방문 희망일: 오늘 이후만, 모임 요일이 아니면 안내
const dateEl = $("visitdate");
const today = new Date(); today.setHours(0,0,0,0);
dateEl.min = today.toISOString().slice(0,10);
$("dateHint").textContent = CHAPTER.when + " 모임입니다.";
dateEl.addEventListener("change", () => {
  const d = new Date(dateEl.value + "T00:00:00");
  $("dateHint").textContent = (d.getDay() === CHAPTER.weekday)
    ? "좋습니다. 이 날 뵙겠습니다." : "모임 요일이 아닙니다. " + CHAPTER.when + "에 맞춰 선택해주세요.";
});

const src = new URLSearchParams(location.search).get("s") || "직접";

const f = $("f");
f.addEventListener("submit", async (e) => {
  e.preventDefault();
  const d = new Date(dateEl.value + "T00:00:00");
  if (d.getDay() !== CHAPTER.weekday) {
    $("dateHint").textContent = "모임 요일이 아닙니다. " + CHAPTER.when + "에 맞춰 선택해주세요.";
    dateEl.focus(); return;
  }
  const btn = $("btn");
  btn.disabled = true; btn.textContent = "전송 중...";
  $("err").style.display = "none";

  const data = new URLSearchParams(new FormData(f));
  data.append("type", "visit");
  data.append("source", src);
  data.append("agree", "동의");

  try {
    const res = await fetch(SCRIPT_URL, { method:"POST", body:data });
    const txt = await res.text();
    if (!res.ok || txt.trim() !== "ok") throw new Error("응답 오류: " + res.status + " " + txt.slice(0,80));
    f.style.display = "none";
    $("done").style.display = "block";
    $("cta").style.display = "none";
  } catch (err) {
    console.error(err);
    $("err").style.display = "block";
    btn.disabled = false; btn.textContent = "방문 신청하기";
  }
});
</script>
</body>
</html>
